    <html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Report technical support Bourdon YTD 02/09/2026</title>
        <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;600;700&display=swap" rel="stylesheet">
        <style>
            :root {
                --bg: #f7f6fb;
                --card: #ffffff;
                --text: #2b2b2b;
                --muted: #6f6f6f;
                --accent: #a7c7e7;
                --success: #43a047;
            }
            body {
                margin: 0;
                font-family: "Roboto Condensed", "Segoe UI", system-ui, sans-serif;
                color: var(--text);
                background: var(--bg);
            }
            .page {
                max-width: 1400px;
                margin: 0 auto;
                padding: 28px 36px 44px;
            }
            header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 24px;
            }
            header h1 {
                margin: 0;
                font-size: 28px;
            }
            header span {
                color: var(--muted);
                font-size: 14px;
            }
            .kpi-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
                gap: 16px;
                margin-bottom: 28px;
            }
            .kpi-card {
                background: var(--card);
                padding: 18px 20px;
                border-radius: 16px;
                box-shadow: 0 8px 18px rgba(35, 35, 35, 0.08);
            }
            .kpi-card h2 {
                margin: 0 0 6px;
                font-size: 14px;
                color: var(--muted);
                font-weight: 600;
                letter-spacing: 0.04em;
                text-transform: uppercase;
            }
            .kpi-card p {
                margin: 0;
                font-size: 26px;
                font-weight: 700;
                color: var(--text);
            }
            .kpi-card p.kpi-good {
                color: var(--success);
            }
            .charts {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
                gap: 18px;
            }
            .chart {
                background: var(--card);
                padding: 16px;
                border-radius: 16px;
                box-shadow: 0 8px 18px rgba(35, 35, 35, 0.08);
            }
            .chart h3 {
                margin: 0 0 10px;
                font-size: 16px;
            }
            .chart img {
                width: 100%;
                border-radius: 12px;
                background: #ffffff;
            }
            .tables {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
                gap: 18px;
                margin-top: 22px;
            }
            .placeholder {
                background: var(--card);
                padding: 20px;
                border-radius: 12px;
                color: var(--muted);
            }
        </style>
